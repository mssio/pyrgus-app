name: Pyrgus
options:
  bundleIdPrefix: io.mss
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.2"
    CURRENT_PROJECT_VERSION: "3"
    PYRGUS_CHANNEL: beta
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "44JYC649FM"
packages:
  PasswordKit:
    path: Packages/PasswordKit
targets:
  Pyrgus:
    type: application
    platform: auto
    supportedDestinations: [iOS, macOS]
    deploymentTarget:
      iOS: "18.0"
      macOS: "15.0"
    sources: [App]
    dependencies:
      - package: PasswordKit
        product: PasswordKit
      - package: PasswordKit
        product: PasswordClipboard
      - target: PyrgusWidget
        destinationFilters: [iOS]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Pyrgus
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        PyrgusChannel: $(PYRGUS_CHANNEL)
        LSApplicationCategoryType: public.app-category.utilities
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLName: io.mss.p
            CFBundleURLSchemes: [pyrgus]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
    postBuildScripts:
      - name: Stamp beta build time
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        script: |
          plist="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          /usr/libexec/PlistBuddy -c "Delete :PyrgusBuildDate" "$plist" 2>/dev/null || true
          if [ "${PYRGUS_CHANNEL}" = "beta" ]; then
            /usr/libexec/PlistBuddy -c "Add :PyrgusBuildDate string $(date -u +%Y-%m-%dT%H:%M:%SZ)" "$plist"
          fi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.mss.p
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
    scheme: {}
  PyrgusWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources: [Widget]
    dependencies:
      - package: PasswordKit
        product: PasswordKit
      - package: PasswordKit
        product: PasswordClipboard
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Pyrgus
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.mss.p.widget
        TARGETED_DEVICE_FAMILY: "1,2"

